<section id="upload-section" class="my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0">Upload CSV for Segmentation</h2>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('upload_file') }}" enctype="multipart/form-data" id="uploadForm" data-upload-url="{{ url_for('upload_file') }}">
                <div class="form-group">
                    <label for="fileInput">Choose CSV file:</label>
                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="fileInput" name="file" accept=".csv" required>
                        <label class="custom-file-label" for="fileInput" id="fileInputLabel">Select file...</label>
                    </div>
                    <small class="form-text text-muted">Only .csv files are accepted.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    Upload and Predict
                </button>
            </form>
            <div id="upload-feedback" class="mt-3"></div>
        </div>
    </div>
</section>

<script>
// Script to update the custom file input label
document.addEventListener('DOMContentLoaded', function () {
    const fileInput = document.getElementById('fileInput');
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            var fileName = e.target.files[0] ? e.target.files[0].name : 'Select file...';
            var nextSibling = e.target.nextElementSibling;
            if (nextSibling && nextSibling.classList.contains('custom-file-label')) {
                nextSibling.innerText = fileName;
            }
        });
    }
});
</script>
